[project]
name = "thesis-test-time-tabular"
version = "0.1.0"
description = "Leveraging Test-Time Information for Improved Tabular Prediction"
authors = [{name = "Adrian Scheibelhut"}]
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "folktables>=0.0.12",
    "openml>=0.14",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    # Runtime dependency for the JointTSNE method. Source builds may require a
    # C/C++ compiler and an OpenMP runtime when a compatible wheel is unavailable.
    "openTSNE>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "ipykernel",
    "matplotlib",
    "seaborn",
]
tableshift = [
    "tableshift",
]
deep = [
    # TabPFN uses the manual installation sequence documented in README.md.
    "tabicl==2.1.1",
    "torch>=2.2",
]
bag8 = [
    # Required by the eight-fold LightGBM bagging wrapper used in the reported
    # evaluations. This optional dependency also installs substantial model tooling.
    "autogluon.tabular==1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
