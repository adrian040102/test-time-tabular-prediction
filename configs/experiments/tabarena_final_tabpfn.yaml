# tabarena_final_tabpfn.yaml
#
# Main sweep configuration for tabpfn_v2.
#
# Scope (upper bound):
#   datasets   = 50 (31 fold-bearing TabArena x 3 folds + 19 fixed-split x 1 run)
#   methods    = 136 (inductive_baseline + compatible method configurations)
#   eval policy= folds3_else1 (seed 0. TabArena 3 folds and fixed-split 1 run, without bootstrap)
#   runs       = 15,232
#
# Generate the fold-aware execution manifest with
# ``scripts/slurm/generate_manifest.py``. The configured datasets have at most
# 10,000 training rows and 500 original features. The runtime guard also checks
# the transformed row count, feature count and the limit of 10 classes.
# Weight-only configurations are omitted because TabPFNv2 cannot consume sample
# weights.
#
# Suggested output: ``results/runs/tabarena_final_tabpfn/``.
#

